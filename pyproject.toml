[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-decisioning"
version = "0.1.0"
description = "Local-first PD/LGD/EAD underwriting and portfolio-risk platform"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.6", "pyyaml>=6.0", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10", "pandas-stubs"]
aws = ["boto3>=1.34", "sagemaker>=2.215"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "credit_risk.simulation"
ignore_errors = true
